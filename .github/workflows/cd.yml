name: CD

# Build & publish container images on pushes to main or version tags.
# Deployment step is a documented placeholder — wire it to your host
# (Docker host via SSH, Render, Fly.io, etc.) and add the matching secrets.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ── Placeholder deploy step ──────────────────────────────────────────────
      # Replace with your real deploy. Example (Docker host over SSH):
      #
      #   - name: Deploy over SSH
      #     uses: appleboy/ssh-action@v1
      #     with:
      #       host: ${{ secrets.DEPLOY_HOST }}
      #       username: ${{ secrets.DEPLOY_USER }}
      #       key: ${{ secrets.DEPLOY_SSH_KEY }}
      #       script: |
      #         cd /opt/hr && docker compose pull && docker compose up -d
      #
      # Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
      - name: Deployment placeholder
        run: |
          echo "Images built and pushed to ghcr.io/${{ github.repository }}."
          echo "Configure the deploy step above with your host + secrets to go live."
