name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, test, audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hrpass
          POSTGRES_DB: swot_hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hr:hrpass@localhost:5432/swot_hr_test
      TEST_DATABASE_URL: postgresql://hr:hrpass@localhost:5432/swot_hr_test
      JWT_SECRET: ci_test_jwt_secret_at_least_32_chars_long_000
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend — typecheck, test, build, audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  security:
    name: Security — secret scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate SBOM (CycloneDX)
        run: |
          cd backend && npm ci --ignore-scripts && npm sbom --sbom-format=cyclonedx > ../sbom-backend.json || true
          cd ../frontend && npm ci --ignore-scripts && npm sbom --sbom-format=cyclonedx > ../sbom-frontend.json || true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json
